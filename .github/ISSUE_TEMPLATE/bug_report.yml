name: Bug report
description: Report a reproducible HawkProbe problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve HawkProbe. Please remove secrets and private target details before posting.
  - type: input
    id: version
    attributes:
      label: HawkProbe version
      placeholder: hawkprobe 1.3.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS / architecture
      placeholder: Linux amd64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Redact tokens, cookies, credentials, and private targets.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Extra context
      description: Logs, minimal fixtures, screenshots, or other useful details.
